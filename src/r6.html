<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogBench R6 · 本机大文件工作台</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/r6/r6.css">
</head>
<body class="r6-body">
<div class="ud-app lb-app r6-app" id="app" data-theme="ink">
  <header class="lb-header r6-header">
    <div class="r6-brand">LogBench <span>R6</span></div>
    <div class="r6-search">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜索日志（250ms 去抖，回车立即）" aria-label="搜索日志">
      <button id="search-cancel" class="r6-icon" title="取消查询" aria-label="取消查询" hidden>停止</button>
    </div>
    <div class="r6-actions">
      <label class="r6-file">
        <input id="file-input" type="file" multiple accept=".log,.txt,text/plain" hidden>
        <span class="r6-button" id="import-trigger" role="button" tabindex="0">打开本机文件</span>
      </label>
      <button class="r6-button" id="server-trigger" type="button" title="服务端加速（需显式开启）">服务端加速</button>
      <select id="theme" aria-label="阅读主题">
        <option value="ink">ink</option>
        <option value="paper">paper</option>
        <option value="graphite">graphite</option>
        <option value="nord">nord</option>
      </select>
      <button class="r6-live" id="live-status" type="button" data-mode="idle"
              title="事件流：未连接">
        <span class="r6-live-dot" aria-hidden="true"></span>
        <span id="live-label">未连接</span>
      </button>
      <span class="r6-status" id="status" role="status" aria-live="polite">准备就绪</span>
    </div>
  </header>

  <div class="r6-shell">
    <nav class="r6-nav" aria-label="视图">
      <button class="r6-nav-item is-active" data-view="logs">日志</button>
      <button class="r6-nav-item" data-view="files">文件库</button>
      <button class="r6-nav-item" data-view="intake">采集中心</button>
      <button class="r6-nav-item" data-view="rules" id="nav-rules" hidden>规则</button>
      <button class="r6-nav-item" data-view="cache" id="nav-cache" hidden>解析缓存</button>
      <button class="r6-nav-item" data-view="runtime" id="nav-runtime" hidden>运行</button>
      <button class="r6-nav-item" data-view="storage" id="nav-storage" hidden>存储位置</button>
      <div class="r6-nav-foot" id="file-list" aria-label="已导入文件"></div>
    </nav>

    <main class="r6-main">
      <div class="r6-toolbar" id="toolbar">
        <span class="r6-meta" id="file-label">未打开文件</span>
        <span class="r6-count" id="search-count">输入关键词开始搜索</span>
        <button class="r6-icon" id="time-scope" type="button" title="跨来源时间范围">时间范围</button>
        <button class="r6-icon" id="time-compare" type="button" title="2–4 文件按时间对齐">时间对比</button>
        <label class="r6-page-size">每页
          <select id="page-size">
            <option>1000</option>
            <option selected>5000</option>
            <option>10000</option>
            <option>30000</option>
            <option>50000</option>
          </select>
        </label>
      </div>

      <div class="r6-reader" id="reader" tabindex="0" role="region" aria-label="日志表">
        <div class="r6-spacer" id="spacer"></div>
        <div class="r6-rows" id="rows"></div>
        <div class="r6-empty" id="empty">导入一个日志文件，或从左侧选择一个已导入文件。</div>
      </div>

      <button class="r6-new-records" id="new-records" type="button" hidden>
        有 <span id="new-count">0</span> 条新记录 · 跳到最新
      </button>

      <div class="r6-intake-view" id="intake-view" role="region" aria-label="采集中心" hidden></div>

      <section class="r6-library-view" id="library-view" role="region" aria-label="统一文件库" hidden></section>

      <section class="r6-storage-view" id="storage-view" role="region" aria-label="存储位置" hidden></section>

      <section class="r6-admin-view" id="rule-view" role="region" aria-label="规则管理" hidden></section>

      <section class="r6-admin-view" id="cache-view" role="region" aria-label="解析缓存" hidden></section>

      <section class="r6-admin-view" id="runtime-view" role="region" aria-label="运行记录" hidden></section>

      <section class="r6-compare-view" id="compare-view" role="region" aria-label="文件时间对比" hidden></section>

      <div class="r6-timeline" id="timeline" role="region" aria-label="时间线">
        <div class="r6-timeline-head">
          <span>时间线</span>
          <span id="timeline-meta" class="r6-meta">—</span>
          <button class="r6-icon" id="tl-prev" aria-label="上一页节点">上一页</button>
          <button class="r6-icon" id="tl-next" aria-label="下一页节点">下一页</button>
          <select id="tl-size" aria-label="时间线每页节点">
            <option>20</option>
            <option selected>50</option>
            <option>100</option>
            <option>150</option>
          </select>
        </div>
        <div class="r6-timeline-nodes" id="timeline-nodes"></div>
      </div>
    </main>

    <aside class="r6-drawer" id="drawer" role="dialog" aria-modal="false" aria-label="记录详情" hidden>
      <div class="r6-drawer-head">
        <span id="drawer-title">记录详情</span>
        <button class="r6-icon" id="drawer-prev" aria-label="上一条">↑</button>
        <button class="r6-icon" id="drawer-next" aria-label="下一条">↓</button>
        <button class="r6-icon" id="drawer-close" aria-label="关闭详情">✕</button>
      </div>
      <div class="r6-drawer-body" id="drawer-body"></div>
    </aside>
  </div>

  <div class="r6-dialog" id="wizard-dialog" role="dialog" aria-modal="true"
       aria-label="添加日志源" hidden></div>

  <div class="gt-dialog" id="time-dialog" role="dialog" aria-modal="true"
       aria-label="全局时间范围" hidden></div>

  <section class="r6-jobs" id="jobs" aria-label="导入任务" hidden>
    <div class="r6-jobs-head">
      <strong>导入任务</strong>
      <span id="jobs-summary" class="r6-meta"></span>
      <button class="r6-icon" id="jobs-min" aria-label="最小化任务面板">—</button>
      <button class="r6-icon" id="jobs-close" aria-label="关闭任务面板">✕</button>
    </div>
    <ul class="r6-jobs-list" id="jobs-list" aria-live="polite"></ul>
  </section>

  <section class="r6-server" id="server-panel" aria-label="服务端加速" hidden>
    <div class="r6-server-head">
      <strong>服务端加速</strong>
      <span class="r6-meta" id="server-hint">默认关闭：只有显式开启后才会上传</span>
      <button class="r6-icon" id="server-close" aria-label="关闭服务端加速面板">✕</button>
    </div>
    <div class="r6-server-body">
      <label class="r6-server-optin">
        <input type="checkbox" id="server-optin">
        <span>将所选文件上传到服务器并在服务端建立索引（需管理员，文件会离开本机）</span>
      </label>
      <div class="r6-server-row">
        <input id="server-file" type="file" accept=".log,.txt,text/plain" disabled>
        <button class="r6-button" id="server-start" disabled>开始上传</button>
        <button class="r6-button" id="server-pause" disabled>暂停</button>
        <button class="r6-button" id="server-resume" disabled>继续</button>
      </div>
      <div class="r6-server-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" id="server-bar-wrap">
        <div class="r6-server-bar" id="server-bar"></div>
      </div>
      <div class="r6-server-status" id="server-status" aria-live="polite">未开始</div>
      <div class="r6-server-row">
        <button class="r6-button" id="server-open" disabled>在服务端视图打开</button>
        <span class="r6-meta" id="server-file-label">—</span>
      </div>
    </div>
  </section>
</div>
<script src="/assets/r6.js"></script>
<script src="/assets/r6/app.js"></script>
</body>
</html>
