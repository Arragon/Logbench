function renderLogTableLegacy(rows){if(!rows.length)return`<div class="empty"><span class="empty-ico">${I('search','lg')}</span><strong>${baseRecords().length?'没有匹配的日志':'尚未打开日志'}</strong><p>${baseRecords().length?'调整时间范围或搜索条件。原始文件和已保存的视角不会改变。':'打开本地日志，或从文件库选择示例文件。'}</p>${B(baseRecords().length?'清除筛选':'打开日志',baseRecords().length?'clear-all-filters':'import',baseRecords().length?'refresh':'upload')}</div>`;

class VirtualList{
constructor(el,items,renderItem,estimate,{head=0,measure=true,onScroll=null}={}){this.el=el;this.items=items;this.renderItem=renderItem;this.head=head;this.measure=measure;this.onScroll=onScroll;this.tree=new Engine.Heights(items.map(estimate));this.byId=new Map(items.map((x,i)=>[x.id??x.key,i]));this.region=el.querySelector('.virtual-region');this.content=el.querySelector('.virtual-items');this.start=-1;this.end=-1;this.dead=false;this.extra=0;this.scrollHandler=()=>{this.paint();this.onScroll?.(el.scrollTop);};el.addEventListener('scroll',this.scrollHandler,{passive:true});if(measure)this.observer=new ResizeObserver(()=>{if(!this.raf)this.raf=requestAnimationFrame(()=>{this.raf=null;this.measureNow();});});this.paint(true);}
paint(force=false){if(this.dead||!this.items.length)return;const top=Math.max(0,this.el.scrollTop-this.head),start=Math.max(0,this.tree.indexAt(top)-6),end=Math.min(this.items.length,this.tree.indexAt(top+this.el.clientHeight)+9);this.region.style.height=(this.tree.total+this.extra)+'px';if(!force&&start===this.start&&end===this.end)return;this.start=start;this.end=end;this.observer?.disconnect();this.content.style.transform=`translateY(${this.tree.sum(start)}px)`;this.content.innerHTML=this.items.slice(start,end).map((x,j)=>`<div class="virtual-item" data-vi="${start+j}">${this.renderItem(x,start+j)}</div>`).join('');if(this.measure){this.content.querySelectorAll('[data-vi]').forEach(x=>this.observer.observe(x));this.measureNow();}}
measureNow(){if(this.dead||!this.measure)return;const first=this.tree.indexAt(Math.max(0,this.el.scrollTop-this.head)),before=this.tree.sum(first);let changed=false;for(const node of this.content.children){const i=Number(node.dataset.vi),h=node.getBoundingClientRect().height;if(h>0&&Math.abs(this.tree.values[i]-h)>.5){this.tree.set(i,h);changed=true;}}if(changed){const delta=this.tree.sum(first)-before;if(Math.abs(delta)>.5)this.el.scrollTop+=delta;this.region.style.height=(this.tree.total+this.extra)+'px';this.content.style.transform=`translateY(${this.tree.sum(this.start)}px)`;}}
toId(id,y=40){const i=this.byId.get(id);if(i===undefined)return;const target=Math.max(0,this.head+this.tree.sum(i)-y);this.extra=Math.max(0,target+this.el.clientHeight-(this.tree.total+this.head));this.region.style.height=(this.tree.total+this.extra)+'px';this.el.scrollTop=target;this.paint(true);this.measureNow();const item=this.content.querySelector(`[data-vi="${i}"]`);if(item){const actual=item.getBoundingClientRect().top-this.el.getBoundingClientRect().top;this.el.scrollTop+=actual-y;}}
destroy(){this.dead=true;this.el.removeEventListener('scroll',this.scrollHandler);this.observer?.disconnect();cancelAnimationFrame(this.raf);}}
let currentLogItems=[];
function logItems(rows){const pages=Math.max(1,Math.ceil(rows.length/S.pageSize));S.page=Math.min(pages,Math.max(1,S.page));const pageRows=rows.slice((S.page-1)*S.pageSize,S.page*S.pageSize);if(!S.folded.size)return pageRows;const ints=intervals().filter(it=>S.folded.has(it.id)),out=[],seen=new Set();for(const r of pageRows){const it=ints.find(i=>r.key>i.start&&r.key<i.end);if(!it)out.push(r);else if(!seen.has(it.id)){out.push({id:'fold-'+it.id,fold:it});seen.add(it.id)}}return out;}

function renderRuleEditorR4(p){if(S.ruleSection==='fields'){return`<div class="editor-title"><h3>字段提取</h3>${B('新增提取规则','edit-extractor','plus','sm','data-index="-1"')}</div><p class="description">从消息正文、续行或完整记录中提取字段。原始文本始终保留；提取结果供异常判断、详情与后续视角使用。</p><details class="rule-guide"><summary>作用方式与规则写法</summary><div><p>依次执行已启用规则。先用正则定位，再用捕获组生成字段名和值。同名字段重复出现时保留每一项，不覆盖前值。</p><p>例：正文 <code>PPe: 4.5mJ</code>，表达式 <code>PPe:\\s*(?&lt;value&gt;[\\d.]+)</code>，固定字段名 <code>PPe</code>，取值组 <code>value</code>，单位 <code>mJ</code>，得到 <code>PPe = 4.5</code>。</p><p>动态字段使用 <code>(?&lt;key&gt;…)</code> 与 <code>(?&lt;value&gt;…)</code>。采用 JavaScript 正则，全局、逐行、不区分大小写匹配。类型只作标注，数值原串不转换或截断。</p></div></details><div class="editable-rules">${p.extractors.map((q,i)=>`<div class="editable-rule"><label class="check"><input type="checkbox" data-enable-extractor="${i}" ${q.enabled!==false?'checked':''} aria-label="启用 ${E(q.name)}"></label><div class="grow"><div class="rule-name">${E(q.name)} <span class="badge">${{message:'消息正文',body:'多行续行',both:'正文＋续行',raw:'完整原文'}[q.source]}</span></div><code class="rule-pattern">${E(q.pattern)}</code><div class="hint">输出：${q.key?E(q.key):'key 捕获组'} ← ${E(q.group||'value')} · ${E(q.type||'auto')}${q.unit?' · '+E(q.unit):''}</div></div>${B('编辑','edit-extractor','edit','ghost sm',`data-index="${i}"`)}${B('','delete-extractor','trash','icon ghost sm',`data-index="${i}" aria-label="删除 ${E(q.name)}"`)}</div>`).join('')||'<p class="hint empty-small">没有提取规则。原始记录仍可阅读。</p>'}</div>`;}

function validateBackup(value){if(value?.format!=='LogBench Workspace Backup'||value.version!==1||value.workspace?.schema!=='logbench.workspace'||value.workspace.version!==1||!Array.isArray(value.files))throw Error('不支持的备份格式或版本，当前工作区未改变。');const problem=snapshotProblem(value.workspace);if(problem)throw Error(problem+'，当前工作区未改变。');const ids=new Set();let total=0;for(const f of value.files){if(typeof f.id!=='string'||!f.id.startsWith('local-')||ids.has(f.id)||typeof f.name!=='string'||typeof f.text!=='string'||typeof f.path!=='string')throw Error('文件条目无效或重复，当前工作区未改变。');ids.add(f.id);total+=f.text.length;if(f.text.length>64*1024*1024||total>128*1024*1024)throw Error('备份超过原型的读取上限。');}const ps=value.workspace.state?.appliedProfiles;if(!Array.isArray(ps)||!ps.length||ps.length>200)throw Error('备份缺少有效规则配置。');ps.forEach(Engine.validate);return true;}

async function retryStorage(){if(storageState.restoreBlocked){notify('已有缓存格式异常，已停止自动覆盖。请先导出备份，再导入一份有效备份恢复。',true);return;}storageState.issue='';try{for(const f of files.filter(f=>f.source==='local'&&!f.sample))await cachePut(f);flushState();await writeSnapshot(stateSnapshot());}catch{}storagePanel();}

function r6Detail(x){const cap=r6Capabilities(x.protocol);return`<aside class="r6-drawer" aria-label="日志源详情"><div class="r6-drawer-head">${I('server')}<span class="grow">${E(x.name)}</span>${r6Btn('','close-detail','close','icon ghost sm','aria-label="关闭日志源详情"')}</div><div class="r6-drawer-body"><div class="row">${r6Status(x)}<span class="spacer"></span><span class="r6-sub">${r6Protocols[x.protocol]}</span></div><h3 class="r6-section-title">当前采集链路</h3><ol class="r6-steps"><li class="r6-step"><span class="r6-step-mark">${I('check','sm')}</span><div><strong>发现目录与文件</strong><p>扫描 ${x.maps.length} 个目录 · ${x.count} 个文件已登记</p></div></li><li class="r6-step"><span class="r6-step-mark">${I('check','sm')}</span><div><strong>${x.status==='recovering'?'已恢复连接，继续补采':'原文持久归档'}</strong><p>${x.raw} 已确认落盘 · 不重复写入已提交范围</p></div></li><li class="r6-step ${x.coverage<100?'warn':''}"><span class="r6-step-mark">${I(x.coverage<100?'clock':'check','sm')}</span><div><strong>${x.coverage<100?'增量索引追赶中':'索引已追上归档'}</strong><p>${x.indexed} 可查询 · ${x.coverage}% 当前覆盖</p></div></li></ol><div class="r6-watermark"><div><small>已归档检查点</small><b>${x.raw}</b></div><div><small>已索引检查点</small><b>${x.indexed}</b></div></div>${x.status==='recovering'?'<div class="r6-note warn">网络已恢复不等于解析已完成。原文与索引分别记录进度，缺失段会显式标记。</div>':''}<h3 class="r6-section-title">目录映射</h3>${x.maps.map(m=>`<div class="r6-map-line"><div class="r6-mapping-dir">${I('folder','sm')}<code>${E(m.remote)}</code></div><div class="r6-meta">${I('arrow','sm')} ${E(r6Root(m.root)?.path+'/'+m.target)}</div><div class="r6-meta">继承规则：${E(m.rule)}</div></div>`).join('')}<h3 class="r6-section-title">连接能力</h3><div class="r6-capabilities">${r6Badge(cap.list?'目录发现':'目录清单需配置',cap.list?'good':'warn')}${r6Badge(cap.range?'范围读取':'无范围续传',cap.range?'blue':'warn')}${r6Badge(cap.live?'追加追踪':'版本快照',cap.live?'good':'')}</div><p class="r6-mininote">${E(cap.text)}</p><h3 class="r6-section-title">归档与访问</h3><dl class="r6-kv"><dt>源文件删除</dt><dd>保留本地归档，不传播删除</dd><dt>文件轮转</dt><dd>按代次归档，旧代次继续补齐</dd><dt>首次采集</dt><dd>从头归档，历史补采与新日志分别排队</dd><dt>访问范围</dt><dd>${E(x.readers)}</dd><dt>采集身份</dt><dd>${E(x.credential)} · 仅引用，不显示密钥</dd></dl></div><div class="r6-drawer-foot">${r6Btn('打开阅读示例','read-source','logs','primary',`data-id="${x.id}"`)}${r6Btn('编辑','edit-source','edit','',`data-id="${x.id}"`)}${r6Btn(x.status==='paused'?'继续':'暂停','pause',x.status==='paused'?'play':'pause','',`data-id="${x.id}"`)}</div></aside>`;}
function r6Storage(){return`<div class="r6-toolbar"><span class="r6-sub">逻辑总库聚合多个物理根目录；文件用存储位置 ID 区分，不靠同名路径合并。</span><span class="spacer"></span>${r6Btn('查看总库','library','folder','sm')}</div><div class="r6-pane"><div class="r6-table-scroll"><table class="r6-table r6-root-table"><thead><tr><th>存储位置</th><th>物理目录</th><th>状态 / 可用空间</th><th>映射数</th><th>操作</th></tr></thead><tbody>${R6.roots.map(x=>`<tr><td><div class="r6-source-title"><div class="r6-source-symbol">${I('database')}</div><div class="r6-entity">${E(x.name)}<div class="r6-meta">${E(x.type)} · ${x.id}</div></div></div></td><td><div class="r6-path">${E(x.path)}</div><div class="r6-meta">索引：${E(x.cache)}</div></td><td>${r6Badge(x.state==='online'?'可读写':'离线 / 未挂载',x.state==='online'?'good':'bad')}<div class="r6-meta">${E(x.free)}${x.state==='online'?' 可用（示例）':''}</div></td><td>${R6.sources.flatMap(s=>s.maps).filter(m=>m.root===x.id).length}</td><td><div class="r6-inline-actions">${r6Btn('浏览','root-browse','folder','ghost sm',`data-id="${x.id}" ${x.state==='offline'?'disabled':''}`)}${r6Btn('设置','edit-root','settings','ghost sm',`data-id="${x.id}"`)}</div></td></tr>`).join('')}</tbody></table><div style="padding:20px 18px;max-width:900px"><div class="r6-note warn">${I('shield')}目录离线时暂停该位置的写入，不会自动退回部署目录，也不会把“未挂载”当作空目录重新创建。</div><h3 class="r6-section-title">存储位置与采集目录分开管理</h3><dl class="r6-kv"><dt>管理员登记</dt><dd>先注册绝对路径并验证服务账号的读写权限、挂载身份和剩余空间。</dd><dt>每个远程目录</dt><dd>选择存储位置和独立子目录。相对路径保留，重叠目标在保存前阻止。</dd><dt>统一检索</dt><dd>文件、时间范围和多文件对比使用同一总库目录，不要求物理目录相邻。</dd><dt>解析索引</dt><dd>索引留在服务器本地磁盘；不把 SQLite WAL 数据库放在 SMB / NFS 共享盘。</dd></dl></div></div></div><div class="r6-foot">${I('lock','sm')}存储登记不修改系统权限、不执行挂载；示例中不会访问这些路径。</div>`;}
function r6Cache(){return`<div class="r6-resource"><div><strong>按文件代次复用，不因重新打开而重解析</strong><small>原文、结构索引、规则结果分层保存；颜色与列设置不触发重建。</small></div><span class="spacer"></span><span class="r6-healthmark">2 个解析进程 · 初始建议</span>${r6Btn('资源设置','tuning','sliders','sm')}</div><div class="r6-toolbar"><span class="r6-sub">查询只使用已提交索引；重建时继续提供旧版，并标明规则版本。</span><span class="spacer"></span>${r6Btn('演示规则结果重建','cache-rebuild','refresh','sm')}</div><div class="r6-pane"><div class="r6-table-scroll"><table class="r6-table"><thead><tr><th>文件 / 代次</th><th>归档原文</th><th>结构索引</th><th>规则结果</th><th>覆盖 / 状态</th><th>操作</th></tr></thead><tbody>${R6.sources.map((x,i)=>`<tr><td><button class="r6-link" data-r6="read-source" data-id="${x.id}">${['cpqpsgx.log','device_io.log','build_20261031.log','legacy_10.log'][i]||'session.log'}</button><div class="r6-meta">${E(x.name)} · g00${7+i}</div></td><td class="mono">${x.raw}</td><td><span class="r6-badge ${x.count?'good':''}">${I(x.count?'check':'clock','sm')}${x.count?'可复用':'待建立'}</span><div class="r6-meta">分帧 / 时间 / 原文位置</div></td><td>${r6Badge(!x.count?'未开始':R6.rebuilding&&i===0?'重算中 · 旧版可读':'版本有效',!x.count?'':R6.rebuilding&&i===0?'blue':'good')}<div class="r6-meta">${i===0?'CPQPSGX 1.2':x.maps[0].rule}</div></td><td><span class="mono">${x.coverage}%</span><div class="r6-meta">${x.indexed} 已提交</div></td><td>${r6Btn('缓存详情','cache-detail','info','ghost sm',`data-id="${x.id}"`)}</td></tr>`).join('')}</tbody></table><div style="padding:20px 18px;max-width:900px"><h3 class="r6-section-title">什么时候需要重算？</h3><div class="r6-review-grid"><section><h3>仅追加新日志</h3><p class="r6-mininote">从最后提交的字节与记录边界继续，尾部未结束的 Traceback 保留为待完成记录。</p></section><section><h3>修改提取 / 异常 / 节点规则</h3><p class="r6-mininote">只重算受影响的规则结果层；规则草稿与已应用版本完全分开。</p></section><section><h3>修改配色或点位形状</h3><p class="r6-mininote">直接更新呈现。有效的结构索引、字段与命中证据无需重建。</p></section><section><h3>原文被替换、截断或规则引擎升级</h3><p class="r6-mininote">创建新代次或新索引版本；校验后切换，不让旧索引悄悄对应新文件。</p></section></div></div></div></div><div class="r6-foot">${I('database','sm')}缓存可重建；检查点与原文归档属于持久数据，不作为缓存清理。</div>`;}
function r6Events(){return`<div class="r6-toolbar"><span class="r6-sub">采集、断线重连、归档、索引和权限事件均保留来源与时间。</span><span class="spacer"></span>${r6Btn('导出示例记录','export-events','download','sm')}</div><div class="r6-table-scroll"><ol class="r6-log-list">${R6.events.map(e=>`<li><time>${E(e.at)}</time><span>${E(e.source)}</span><span>${r6Badge(e.kind,e.tone)}</span><div>${E(e.text)}</div></li>`).join('')}</ol></div><div class="r6-foot">最近 ${R6.events.length} 条交互示例 · 未运行任何远程采集</div>`;}
function r6NewSource(id){r6Draft=clone(id?r6Source(id):{id:null,name:'',protocol:'sftp',endpoint:'',port:22,credential:'只读采集密钥',mode:'live',poll:2,scan:60,first:'all',verification:'append',readers:'仅管理员',maps:[{remote:'/log/',root:'main',target:'new-source/logs',rule:'CPQPSGX 标准'}]});r6Step=0;r6Probe=false;r6ProbeKind='ready';r6Wizard();}
function r6CaptureDraft(){if(!r6Draft)return;for(const el of $$('[data-r6-field]'))r6Draft[el.dataset.r6Field]=el.type==='number'?Number(el.value):el.value;for(const el of $$('[data-r6-map]'))r6Draft.maps[Number(el.dataset.r6Index)][el.dataset.r6Map]=el.value;}
const r6Field=(label,key,value,options={})=>`<div class="field"><label class="label" for="r6-field-${key}">${label}</label><input class="input ${options.mono?'mono':''}" id="r6-field-${key}" data-r6-field="${key}" type="${options.type||'text'}" value="${E(value??'')}" ${options.type==='number'?'min="1" max="65535"':''} ${options.placeholder?`placeholder="${E(options.placeholder)}"`:''}><div class="hint">${options.hint||''}</div></div>`;
function r6StepConnection(){const d=r6Draft;return`<div class="r6-protocols" role="group" aria-label="传输协议">${Object.entries(r6Protocols).map(([p,l])=>`<button type="button" data-r6="protocol" data-id="${p}" class="${d.protocol===p?'active':''}" aria-pressed="${d.protocol===p}">${l}</button>`).join('')}</div>${r6Field('日志源名称','name',d.name,{placeholder:'例如：机台 A · 主控日志'})}${r6Field(d.protocol==='http'?'HTTP 基础地址':d.protocol==='smb'?'服务器 / 共享名称':'服务器地址','endpoint',d.endpoint,{mono:true,placeholder:d.protocol==='http'?'https://host.example/logs/':d.protocol==='smb'?'//host.example/logs':'host.example'})}<div class="r6-two">${r6Field('端口','port',d.port,{type:'number'})}<div class="field"><label class="label" for="r6-field-credential">凭据引用</label><select class="select" id="r6-field-credential" data-r6-field="credential">${['只读采集密钥','诊断共享只读账号','构建服务 Token','旧设备只读密钥'].map(x=>`<option ${x===d.credential?'selected':''}>${x}</option>`).join('')}</select><div class="hint">生产版由管理员在服务端管理，不把密码写入浏览器缓存。</div></div></div><div class="r6-note ${d.protocol==='scp'||d.protocol==='http'?'warn':''}">${I('shield')}${E(r6Capabilities(d.protocol).text)}</div><label class="r6-checkrow"><input type="checkbox" checked disabled>${d.protocol==='sftp'||d.protocol==='scp'?'强制验证已登记的 SSH 主机密钥':d.protocol==='http'?'HTTPS 校验证书；HTTP 明文需明确允许':'使用 SMB 2/3；签名与加密能力在预检时确认'}</label>`;}
function r6StepMappings(){const d=r6Draft;return`<p class="r6-mininote" style="margin:0 0 14px">一个日志源可以包含多个远程目录，每个目录指定独立存储位置、子目录和解析规则。</p>${d.maps.map((m,i)=>`<div class="r6-map-editor"><div class="row"><strong style="font-size:12px">目录映射 ${i+1}</strong><span class="spacer"></span>${r6Btn('移除','remove-map','trash','ghost sm',`data-index="${i}" ${d.maps.length===1?'disabled':''}`)}</div><label class="label" for="r6-map-remote-${i}">远程目录</label><input class="input mono" id="r6-map-remote-${i}" data-r6-map="remote" data-r6-index="${i}" value="${E(m.remote)}"><div class="r6-two" style="margin-top:10px"><div class="field"><label class="label" for="r6-map-root-${i}">存储位置</label><select class="select" id="r6-map-root-${i}" data-r6-map="root" data-r6-index="${i}">${R6.roots.map(x=>`<option value="${x.id}" ${m.root===x.id?'selected':''}>${E(x.name)}${x.state==='offline'?' · 离线':''}</option>`).join('')}</select></div><div class="field"><label class="label" for="r6-map-target-${i}">存储子目录</label><input class="input mono" id="r6-map-target-${i}" data-r6-map="target" data-r6-index="${i}" value="${E(m.target)}"></div></div><div class="r6-path-preview" data-map-preview="${i}">${E((r6Root(m.root)?.path||'')+'/'+m.target)}</div><div class="r6-two" style="margin-top:12px"><div><label class="label" for="r6-map-rule-${i}">目录默认规则</label><select class="select" id="r6-map-rule-${i}" data-r6-map="rule" data-r6-index="${i}">${['CPQPSGX 标准','设备诊断','通用方括号'].map(x=>`<option ${x===m.rule?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label" for="r6-map-include-${i}">文件范围</label><input class="input mono" id="r6-map-include-${i}" data-r6-map="include" data-r6-index="${i}" value="${E(m.include||'*.log, *.log.*')}" aria-label="日志匹配模式"><div class="hint">逗号分隔；建议包含轮转文件。</div><details style="margin-top:8px"><summary>排除模式与扫描深度</summary><label class="label" for="r6-map-exclude-${i}">排除模式</label><input class="input mono" id="r6-map-exclude-${i}" data-r6-map="exclude" data-r6-inde function r6StepPolicy(){const d=r6Draft,cap=r6Capabilities(d.protocol);return`<div class="r6-two"><div class="field"><label class="label" for="r6-field-mode">同步方式</label><select class="select" id="r6-field-mode" data-r6-field="mode"><option value="live" ${d.mode==='live'?'selected':''} ${!cap.live?'disabled':''}>持续增量追踪</option><option value="schedule" ${d.mode==='schedule'?'selected':''}>定时同步</option><option value="snapshot" ${d.mode==='snapshot'?'selected':''}>稳定文件快照</option></select></div><div class="field"><label class="label" for="r6-field-first">首次接入</label><select class="select" id="r6-field-first" data-r6-field="first"><option value="all" ${d.first==='all'?'selected':''}>完整归档历史 + 继续追踪</option><option value="new" ${d.first==='new'?'selected':''}>仅接入后新增（保留缺口标记）</option></select></div></div><div class="r6-two">${r6Field('活动文件检查间隔（秒）','poll',d.poll,{type:'number',hint:'只是目标检查周期；可见延迟还包含远端刷盘、传输和索引排队。'})}${r6Field('目录发现间隔（秒）','scan',d.scan,{type:'number',hint:'只扫描元数据，不每次重读整份日志。'})}</div><div class="field"><label class="label" for="r6-field-readers">归档访问范围</label><select class="select" id="r6-field-readers" data-r6-field="readers"><option ${d.readers==='仅管理员'?'selected':''}>仅管理员</option><option ${d.readers==='管理员与研发组'?'selected':''}>管理员与研发组</option></select><div class="hint">新远程日志默认不向未登记访客开放。</div></div><h3 class="r6-section-title">可靠性策略</h3><label class="r6-checkrow"><input checked disabled type="checkbox">断线后从已确认检查点继续，并重新验证文件代次</label><label class="r6-checkrow"><input checked disabled type="checkbox">保留轮转与截断前的原文，不传播远端删除</label><label class="r6-checkrow"><input checked disabled type="checkbox">存储离线、权限失败或空间不足时暂停，明确告警</label><label class="r6-checkrow"><input checked disabled type="checkbox">保存服务器解析索引；没有新增字节时不重复解析</label><div class="r6-note warn" style="margin-top:16px">${I('info')}断线期间已在源端删除或覆盖的内容无法补回。系统标记缺口，不宣称“零丢失”。</div>`;}
function r6StepReview(){const d=r6Draft,cap=r6Capabilities(d.protocol,r6ProbeKind),fail=r6ProbeKind==='auth'||r6ProbeKind==='nolist';return`<div class="r6-review-grid"><section><h3>连接与访问</h3><dl class="r6-kv"><dt>协议</dt><dd>${r6Protocols[d.protocol]}</dd><dt>服务器</dt><dd class="mono">${E(d.endpoint)}</dd><dt>访问范围</dt><dd>${E(d.readers)}</dd></dl></section><section><h3>采集方式</h3><dl class="r6-kv"><dt>模式</dt><dd>${{live:'持续增量',schedule:'定时同步',snapshot:'稳定文件快照'}[d.mode]}</dd><dt>目录映射</dt><dd>${d.maps.length} 个</dd><dt>历史范围</dt><dd>${d.first==='all'?'完整归档历史':'仅接入后新增，有历史缺口'}</dd></dl></section></div><h3 class="r6-section-title">预检与失败恢复</h3><div class="row"><label for="r6-probe-scenario" class="r6-sub">演示情形</label><select id="r6-probe-scenario" class="select" style="flex:1"><option value="ready" ${r6ProbeKind==='ready'?'selected':''}>能力满足</option><option value="auth" ${r6ProbeKind==='auth'?'selected':''}>凭据 / 主机密钥不通过</option>${d.protocol==='http'?`<option value="norange" ${r6ProbeKind==='norange'?'selected':''}>HTTP 不支持 Range</option><option value="nolist" ${r6ProbeKind==='nolist'?'selected':''}>HTTP 无目录清单</option>`:''}</select>${r6Btn('运行预检示例','probe','shield','sm')}</div><p class="r6-mininote">只演示界面状态，不建立远程连接、不检查真实目录。</p>${r6Probe?`<div class="r6-probe"><div class="r6-probe-row ${fail?'bad':''}">${I(fail?'error':'check')}<span>${fail?'连接或目录发现未通过':'身份与主机校验通过（示例）'}</span></div><div class="r6-probe-row ${!cap.range?'warn':''}">${I(cap.range?'check':'warning')}<span>${cap.range?'支持范围读取（示例）':'不支持范围续传，只能完整快照'}</span></div><div class="r6-probe-row">${I('check')}<span>目标子目录无冲突 · 可写性需部署时验证</span></div><div class="r6-probe-row ${!cap.live?'warn':''}">${I(cap.live?'check':'info')}<span>${cap.live?'允许按追加约定启用追踪':'当前能力只允许版本 / 完整快照'}</span></div></div>`:''}${fail&&r6Probe?'<div class="r6-note bad" style="margin-top:12px">先修正凭据、主机密钥或文件清单后重新预检。不会悄悄降级成匿名连接。</div>':''}<div class="r6-errorbox" id="r6-wizard-error" role="alert"></div>`;}

case'save-root':{const name=$('#r6-root-name').value.trim(),path=$('#r6-root-path').value.trim(),cache=$('#r6-root-cache').value.trim(),err=$('#r6-root-error');if(!name||!path.startsWith('/')||!cache.startsWith('/')||path.includes('..')||cache.includes('..')){err.textContent='请填写名称与不包含 .. 的绝对路径。';break;}if(R6.roots.some(r=>r.id!==R6.editRoot&&(path===r.path||path.startsWith(r.path+'/')||r.path.startsWith(path+'/')))){err.textContent='存储根目录不可重复或相互包含。';break;}if(R6.editRoot)Object.assign(r6Root(R6.editRoot),{name,cache});else R6.roots.push({id:'root-'+Date.now(),name,path,cache,state:'online',free:'待真实预检',type:'自定义位置',defaultRule:'CPQPSGX 标准'});r6Persist();$('#dialog').close();R6.tab='storage';S.view='sync';render();notify('已保存存储位置示例；服务器实际可写性尚未验证。');break;}
case'library':R6.localLibrary=false;R6.libraryRoot='all';S.view='files';render(false);break;
case'root-browse':R6.localLibrary=false;R6.libraryRoot=id;S.view='files';render(false);break;
case'local-library':R6.localLibrary=true;S.libSource='local';S.folder='';S.view='files';render(false);break;
case'storage-tab':R6.tab='storage';S.view='sync';render(false);break;
case'tuning':r6Tuning();break;
case'save-tuning':{const ks=['collect','perHost','parse','backfill','chunk','memory'],v={};for(const k of ks)v[k]=Number($('#r6-tune-'+k).value);if(ks.some(k=>!Number.isInteger(v[k])||v[k]<1||v[k]>64)||v.perHost>v.collect){$('#r6-tune-error').textContent='请输入 1–64 的整数，且单主机并发不能超过总并发。';break;}R6.tuning={...R6.tuning,...v};r6Persist();$('#dialog').close();render();notify('资源预算已保存在原型；没有修改服务器运行参数。');break;}
case'cache-detail':r6CacheDetail(id);break;
case'cache-rebuild':R6.rebuilding=!R6.rebuilding;r6Event('规则缓存',R6.rebuilding?'重建示例':'切换示例',R6.rebuilding?'创建新规则结果版本，旧索引继续可读。':'新规则结果验证后切换；原文未重新下载。','blue');if($('#dialog').open)$('#dialog').close();R6.tab='cache';S.view='sync';render();notify(R6.rebuilding?'已切换到重建中示例；再次点击可查看完成态。':'已切换到完成态示例。');break;
case'export-events':download('LogBench_R6_demo_events.json',JSON.stringify({synthetic:true,events:R6.events},null,2),'application/json');break;
case'read-source':r6OpenReading(id);break;
case'follow':R6.liveFollow=!R6.liveFollow;R6.newLines=0;render();if(R6.liveFollow)$('#log-scroll')?.scrollTo({top:$('#log-scroll').scrollHeight});break;
case'append-demo':R6.newLines+=12;render();notify('模拟收到 12 条新增通知；正文不伪造远程采集结果。');break;
case'read-new':R6.newLines=0;R6.liveFollow=true;render();$('#log-scroll')?.scrollTo({top:$('#log-scroll').scrollHeight});break;
} },true);
document.addEventListener('input',e=>{if(e.target.id==='r6-source-search'){R6.search=e.target.value;render(true);}if(e.target.matches('[data-r6-map]')){r6CaptureDraft();r6Probe=false;const i=e.target.dataset.r6Index,p=$('[data-map-preview="'+i+'"]');if(p)p.textContent=(r6Root(r6Draft.maps[i].root)?.path||'')+'/'+r6Draft.maps[i].target;}if(e.target.matches('[data-r6-field]')){r6Probe=false;const b=$('#dialog [data-r6="wizard-save"]');if(b)b.disabled=true;}});
document.addEventListener('change',e=>{if(e.target.id==='r6-source-filter'){R6.sourceFilter=e.target.value;render(false);}if(e.target.matches('[data-r6-map]')){r6CaptureDraft();r6Probe=false;const i=e.target.dataset.r6Index,p=$('[data-map-preview="'+i+'"]');if(p)p.textContent=(r6Root(r6Draft.maps[i].root)?.path||'')+'/'+r6Draft.maps[i].target;}if(e.target.id==='r6-probe-scenario'){r6ProbeKind=e.target.value;r6Probe=false;$('#dialog [data-r6="wizard-save"]').disabled=true;}});
window.LogBenchRemotePreview={state:R6,capabilities:r6Capabilities,validate:r6Validate,getDraft:()=>r6Draft,reset:()=>{localStorage.removeItem(R6_KEY);location.reload();}};

document.addEventListener('click',e=>{const x=e.target.closest('[data-act="about"]');if(!x)return;e.preventDefault();e.stopImmediatePropagation();dialog('LogBench R6 · 新功能设计原型','<div class="r6-form"><p>沿用 R5 的阅读与规则界面，新增远程采集、分散存储与解析缓存的可交互设计。</p><p>所有远程文件、容量、检查点与预检结果均为合成示例。此页面不建立 SSH / SMB / HTTP 连接，不会写入你的服务器配置。</p><p>本原型使用独立浏览器存储命名空间，不修改现有 R5 工作区。</p></div>',r6Btn('关闭','modal-close',null));},true);
document.addEventListener('wheel',e=>{if(R6.liveFollow&&e.deltaY<0&&e.target.closest('#log-scroll')){R6.liveFollow=false;const b=document.querySelector('[data-r6="follow"]');if(b){b.classList.remove('active');b.innerHTML=I('play')+'<span>跟随最新</span>';}notify('已暂停自动跟随；后台采集不受阅读位置影响（示例）。');}}, {capture:true,passive:true});

window.LogBenchPrototype={state:S,getFiles:()=>files,filtered,baseRecords,parseLocal,applyRange,render,runSearch,engine:Engine,indexRecords,processJobs,saveProfile,runTest,openPicker,applyPicker,restoreView,viewSnapshot,importFiles,locate,blockOpen,getVirtual:()=>logVirtual,getCompareVirtuals:()=>compareVirtuals,getCompareAxis,timelineData,parseInWorker,storage:storageState,workspaceBackup,validateBackup,hydrateSnapshot,flushState,restoreCache,cachePut,cacheGetAll,viewSnapshot};
S.view="sync";render(false);window.LogBenchPrototype.ready=restoreCache().finally(()=>{S.view="sync";render(false);});
})();
